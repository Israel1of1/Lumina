<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUMINA | Códigos de vinculación</title>
  <link rel="stylesheet" href="../styles/base.css" />
  <link rel="stylesheet" href="../styles/docentes.css" />
  <link rel="stylesheet" href="../styles/codigos.css" />
</head>
<body data-pagina="codigos">

  <div class="app-layout">
    <div id="sidebar-contenedor"></div>

    <div class="app-layout__main">
      <header class="topbar">
        <div>
          <h2>Códigos de vinculación</h2>
          <p class="texto-suave">Matrícula de estudiantes y contratación de docentes</p>
        </div>
        <div id="topbar-usuario-contenedor"></div>
      </header>

      <main class="contenido">
        <div class="encabezado-modulo">
          <div class="filtros-codigos">
            <select id="filtro-proposito">
              <option value="">Todos los propósitos</option>
              <option value="ENROLLMENT">Matrícula</option>
              <option value="TEACHER_CONTRACT">Contratación docente</option>
            </select>
            <select id="filtro-estado">
              <option value="">Todos los estados</option>
              <option value="PENDING">Pendiente</option>
              <option value="USED">Usado</option>
              <option value="EXPIRED">Expirado</option>
              <option value="REVOKED">Revocado</option>
            </select>
          </div>
          <button class="btn btn-primario" id="btn-generar-codigo">+ Generar código</button>
        </div>

        <section class="panel">
          <div id="tabla-codigos" class="cargando">Cargando...</div>
        </section>
      </main>
    </div>
  </div>

 
  <div class="modal-fondo oculto" id="modal-generar">
    <div class="modal">
      <h2>Generar código de vinculación</h2>
      <form id="form-generar">
        <div class="campo">
          <label for="gen-proposito">Propósito</label>
          <select id="gen-proposito" required>
            <option value="ENROLLMENT">Matrícula de estudiante</option>
            <option value="TEACHER_CONTRACT">Contratación de docente</option>
          </select>
        </div>
        <div class="campo">
          <label for="gen-expiracion">Fecha de expiración (opcional)</label>
          <input type="date" id="gen-expiracion" />
        </div>
        <p id="generar-error" class="texto-error oculto"></p>
        <div class="modal-acciones">
          <button type="button" class="btn btn-secundario" onclick="cerrarModal('modal-generar')">Cancelar</button>
          <button type="submit" class="btn btn-primario">Generar</button>
        </div>
      </form>
    </div>
  </div>


  <div class="modal-fondo oculto" id="modal-resultado">
    <div class="modal">
      <h2>Código generado</h2>
      <p class="nota-modal">Comparte este código con la persona correspondiente. Lo usará para activar su cuenta.</p>
      <div class="codigo-resultado">
        <span id="codigo-generado-texto"></span>
        <button class="btn-icono" id="btn-copiar-codigo">Copiar</button>
      </div>
      <p id="copiado-aviso" class="mensaje-info oculto">Código copiado al portapapeles.</p>
      <div class="modal-acciones">
        <button type="button" class="btn btn-primario" onclick="cerrarModal('modal-resultado')">Listo</button>
      </div>
    </div>
  </div>

  <script src="../app/app.config.js"></script>
  <script src="../core/api.services.js"></script>
  <script src="../app/app.routers.js"></script>
  <script src="../app/app.js"></script>
  <script src="../core/codigos.js"></script>
</body>
</html>
