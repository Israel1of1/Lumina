<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUMINA | Materias</title>
  <link rel="stylesheet" href="../Css/base.css" />
  <link rel="stylesheet" href="../Css/docentes.css" />
  <link rel="stylesheet" href="../Css/materias.css" />
</head>
<body data-pagina="materias">

  <div class="app-layout">
    <div id="sidebar-contenedor"></div>

    <div class="app-layout__main">
      <header class="topbar">
        <div>
          <h2>Materias</h2>
          <p class="texto-suave">Catálogo de materias de la institución</p>
        </div>
        <div id="topbar-usuario-contenedor"></div>
      </header>

      <main class="contenido">
        <div class="encabezado-modulo">
          <div class="buscador">
            <input type="text" id="buscador-materias" placeholder="Buscar materia..." />
          </div>
          <button class="btn btn-primario" id="btn-nueva-materia">+ Nueva materia</button>
        </div>

        <section class="materias-grid" id="materias-grid">
          <div class="cargando">Cargando...</div>
        </section>
      </main>
    </div>
  </div>

  <!-- ===== Modal: Crear / Editar materia ===== -->
  <div class="modal-fondo oculto" id="modal-materia">
    <div class="modal">
      <h2 id="modal-materia-titulo">Nueva materia</h2>
      <form id="form-materia">
        <input type="hidden" id="materia-id" />

        <div class="campo">
          <label for="materia-nombre">Nombre</label>
          <input type="text" id="materia-nombre" placeholder="Ej. Comunicación funcional" required />
        </div>

        <div class="campo">
          <label for="materia-descripcion">Descripción</label>
          <textarea id="materia-descripcion" rows="3"></textarea>
        </div>

        <div class="grid-2">
          <div class="campo">
            <label for="materia-color">Color identificador</label>
            <div class="selector-color">
              <input type="color" id="materia-color" value="#00347a" />
              <span id="vista-color-hex">#00347a</span>
            </div>
          </div>
          <div class="campo">
            <label for="materia-icono">Ícono (nombre o emoji)</label>
            <input type="text" id="materia-icono" placeholder="Ej. 🧩 o 'puzzle'" />
          </div>
        </div>

        <p id="materia-error" class="texto-error oculto"></p>

        <div class="modal-acciones">
          <button type="button" class="btn btn-secundario" onclick="cerrarModal('modal-materia')">Cancelar</button>
          <button type="submit" class="btn btn-primario">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../app/app.config.js"></script>
  <script src="../core/api.services.js"></script>
  <script src="../app/app.routers.js"></script>
  <script src="../app/app.js"></script>
  <script src="../core/materias.js"></script>
</body>
</html>
