<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lúmina </title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/inicio.css">
</head>
<body>

  <div class="pantalla-inicio">

    <div class="circulo-punteado">
      <div class="circulo-blanco" >
        <img src="../img/logo.png" alt="LÚMINA" class="marca-logo" onerror="this.style.display='none'" />
        <svg class="icono-cometa" viewBox="0 0 100 60" fill="none" aria-hidden="true">
          <path class="cometa-estela" d="M30 30 Q 55 8, 78 22" stroke="#E8C24A" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 5"/>
          <circle class="cometa-punta" cx="78" cy="22" r="4" fill="#E8C24A"/>
          <path class="cometa-destello" d="M22 30 L27 20 L32 30 L42 32 L32 34 L27 44 L22 34 L12 32 Z" fill="#F6D75B" stroke="#E8B84B" stroke-width="1.2"/>
        </svg>
      </div>

      <span class="insignia insignia-estrella" aria-hidden="true">★</span>
      <span class="insignia insignia-corazon" aria-hidden="true">♥</span>
    </div>

    <h1 class="titulo-app">LÚMINA</h1>
    <p class="frase-app">Creciendo a tu propio ritmo</p>

    <div class="puntos-avance" role="presentation">
      <span class="punto punto-azul"></span>
      <span class="punto punto-dorado"></span>
      <span class="punto punto-celeste"></span>
    </div>

    <div class="botones-inicio">
  <button id="btn-registrarse" class="boton boton-registrarse" type="button">Registrarse</button>
  <button id="btn-iniciar-sesion" class="boton boton-iniciar-sesion" type="button">Iniciar sesión</button>
</div>

  </div>
<script src="../core/inicio.js"></script>
</body>
</html>
