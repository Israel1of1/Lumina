<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lúmina | Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/portal-tokens.css">
  <link rel="stylesheet" href="../styles/login.css">
</head>
<body>

  <div class="pantalla-login">

    <!-- Panel izquierdo: espacio reservado para tu ilustración -->
    <div class="panel-ilustracion">
           <img src="../img/ilustracion.png" alt="" class="ilustracion-mascota" />
    </div>

    <!-- Panel derecho: formulario -->
    <div class="panel-formulario">
      <div class="panel-formulario__contenido">

        <div class="marca-login">
          <img src="../img/logo.png" alt="LÚMINA" class="marca-logo" onerror="this.style.display='none'" />
          <h1>LÚMINA</h1>
        </div>
        <p class="eslogan-login">
          <span class="eslogan-celeste">Aprende.</span>
          <span class="eslogan-dorado">Comunica.</span>
          <span class="eslogan-marino">Brilla.</span>
        </p>

        <form id="form-login">
          <div class="campo-login">
            <label for="email">Email</label>
            <div class="input-icono">
              <input type="email" id="email" placeholder="tu@correo.com" required autocomplete="username" />
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            </div>
          </div>

          <div class="campo-login">
            <label for="password">Password</label>
            <div class="input-icono">
              <input type="password" id="password" placeholder="Tu contraseña" required autocomplete="current-password" />
              <button type="button" id="btn-ver-password" class="btn-icono-ojo" aria-label="Mostrar contraseña">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <a href="#" class="enlace-olvido" id="enlace-olvido">¿Olvidaste tu contraseña?</a>

          <p id="mensaje-error" class="mensaje-error oculto"></p>
          <p id="mensaje-info" class="mensaje-info oculto"></p>

          <button type="submit" id="btn-login" class="boton-login">Iniciar sesión</button>
        </form>

        <div class="separador-o"><span>o</span></div>

        <p class="enlace-volver-texto">
          ¿Necesitas ayuda? <a href="inicio.html">Volver al inicio</a>
        </p>

      </div>
    </div>

  </div>

  <script src="../app/app.config.js"></script>
  <script src="../core/local.service.js"></script>t>
  <script src="../core/login.js"></script>
</body>
</html>
