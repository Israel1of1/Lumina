<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>registro</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="../styles/registro.css">
</head>
<body>

  <div class="auth-layout">

    <div class="brand-side">

  <img src="../Assets/luminalogo.png" alt="Logo LÚMINA" class="logo-img" id="logo">
    </div>

    <div class="form-side">
    <div class="register-card">

      <h1 class="register-title">REGÍSTRATE</h1>
      <p class="register-subtitle">Únete a la aventura de aprender juntos.</p>

      <p class="section-label">¿Quién eres?</p>

      <div class="role-select">

        <label class="role-option" id="roleParent">
          <input type="radio" name="role" value="padre" checked>
          <span class="role-icon material-icons">family_restroom</span>
          <span class="role-label">Padre / Madre</span>
        </label>

        <label class="role-option" id="roleTeacher">
          <input type="radio" name="role" value="docente">
          <span class="role-icon material-icons">school</span>
          <span class="role-label">Docente</span>
        </label>

      </div>

      <form class="register-form" id="registerForm">

        <div class="input-group">
          <label for="fullname">Nombre completo</label>
          <div class="input-field">
            <input type="text" id="fullname" name="fullname" placeholder="Ej. María García" required>
          </div>
        </div>

        <div class="input-group">
          <label for="email">Correo electrónico</label>
          <div class="input-field">
            <input type="email" id="email" name="email" placeholder="tu@correo.com" required>
          </div>
        </div>

        <div class="input-group">
          <label for="password">Contraseña</label>
          <div class="input-field">
            <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" minlength="8" required>
          </div>
        </div>

        <div class="input-group">
          <label for="confirmPassword">Confirmar contraseña</label>
          <div class="input-field">
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repite tu contraseña" minlength="8" required>
          </div>
        </div>

        <button type="submit" class="btn-register">Crear cuenta →</button>

        <p class="login-text">¿Ya tienes una cuenta? <a href="index.html" class="login-link">Inicia sesión</a></p>

      </form>

    </div>
    </div>

  </div>

  <script src="register.js"></script>
</body>
</html>
