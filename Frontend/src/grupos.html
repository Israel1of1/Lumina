<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUMINA | Grupos</title>
  <link rel="stylesheet" href="../Css/base.css" />
  <link rel="stylesheet" href="../Css/docentes.css" />
  <link rel="stylesheet" href="../Css/grupos.css" />
</head>
<body data-pagina="grupos">

  <div class="app-layout">
    <div id="sidebar-contenedor"></div>

    <div class="app-layout__main">
      <header class="topbar">
        <div>
          <h2>Grupos</h2>
          <p class="texto-suave">Cupo máximo de 10 estudiantes por grupo</p>
        </div>
        <div id="topbar-usuario-contenedor"></div>
      </header>

      <main class="contenido">
        <div class="encabezado-modulo">
          <div class="buscador">
            <input type="text" id="buscador-grupos" placeholder="Buscar grupo..." />
          </div>
          <button class="btn btn-primario" id="btn-nuevo-grupo">+ Nuevo grupo</button>
        </div>

        <section class="grupos-grid" id="grupos-grid">
          <div class="cargando">Cargando...</div>
        </section>
      </main>
    </div>
  </div>

  <!-- ===== Modal: Crear / Editar grupo ===== -->
  <div class="modal-fondo oculto" id="modal-grupo">
    <div class="modal">
      <h2 id="modal-grupo-titulo">Nuevo grupo</h2>
      <form id="form-grupo">
        <input type="hidden" id="grupo-id" />
        <div class="campo">
          <label for="grupo-nombre">Nombre del grupo</label>
          <input type="text" id="grupo-nombre" placeholder="Ej. Grupo A - Mañana" required />
        </div>
        <div class="campo">
          <label for="grupo-nivel">Nivel / grado</label>
          <input type="text" id="grupo-nivel" placeholder="Ej. Preescolar, 1er grado..." />
        </div>
        <div class="campo">
          <label for="grupo-descripcion">Descripción</label>
          <textarea id="grupo-descripcion" rows="3"></textarea>
        </div>
        <p id="grupo-error" class="texto-error oculto"></p>
        <div class="modal-acciones">
          <button type="button" class="btn btn-secundario" onclick="cerrarModal('modal-grupo')">Cancelar</button>
          <button type="submit" class="btn btn-primario">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== Modal: Ver estudiantes del grupo ===== -->
  <div class="modal-fondo oculto" id="modal-estudiantes-grupo">
    <div class="modal modal-grande">
      <h2 id="titulo-estudiantes-grupo">Estudiantes del grupo</h2>
      <div id="lista-estudiantes-grupo"></div>
      <div class="modal-acciones">
        <button type="button" class="btn btn-secundario" onclick="cerrarModal('modal-estudiantes-grupo')">Cerrar</button>
      </div>
    </div>
  </div>

  <script src="../app/app.config.js"></script>
  <script src="../core/api.services.js"></script>
  <script src="../app/app.routers.js"></script>
  <script src="../app/app.js"></script>
  <script src="../core/grupos.js"></script>
</body>
</html>
