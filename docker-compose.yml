services:
  database:
    build:
      context: .
      dockerfile: Database/Dockerfile
    container_name: lumina-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - lumina_db_data:/var/opt/mssql
    networks:
      - lumina-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    container_name: lumina-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5005
      - ConnectionStrings__DefaultConnection=Server=database,1433;Database=LUMINA;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
    ports:
      - "5005:5005"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - lumina-net

  frontend:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
    container_name: lumina-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - lumina-net

volumes:
  lumina_db_data:

networks:
  lumina-net:
    driver: bridge
